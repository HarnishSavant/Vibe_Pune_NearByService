apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibepune-client
  labels:
    app.kubernetes.io/name: vibepune
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vibepune-client
  template:
    metadata:
      labels:
        app: vibepune-client
    spec:
      containers:
        - name: client
          image: nginx:alpine-slim
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  labels:
    app.kubernetes.io/name: vibepune
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: vibepune-client
