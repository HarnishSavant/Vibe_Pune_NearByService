server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html discover.html;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.mapbox-vector-tile;
    gzip_min_length 1024;

    # Crucial for PMTiles & MVT Range Requests (Q12)
    location ~* \.(pmtiles|pbf)$ {
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=86400";
        types {
            application/vnd.mapbox-vector-tile pbf;
            application/x-protobuf pbf;
            application/octet-stream pmtiles;
        }
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
