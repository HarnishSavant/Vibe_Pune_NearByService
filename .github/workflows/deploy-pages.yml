name: Deploy VibePune WebGIS to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Verify Static Geodata & PMTiles
        run: |
          echo "Verifying static client distribution..."
          ls -la client/
          ls -la client/data/
          echo "Static vector PMTiles size: $(ls -lh client/data/vibepune.pmtiles | awk '{print $5}')"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
